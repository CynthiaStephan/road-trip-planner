[project]
name = "server"
version = "0.1.0"
description = ""
authors = [
    {name = "CynthiaStephan",email = "s.cynthia972@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.140.0,<0.141.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "sqlmodel (>=0.0.39,<0.0.40)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "coverage (>=7.15.2,<8.0.0)",
    "poethepoet (>=0.48.0,<0.49.0)"
]

[tool.poe.tasks]

dev = "uvicorn app.main:app --reload"
test = "pytest"
test-cov = "pytest --cov=app"
db-upgrade = "alembic upgrade head"
db-revision = "alembic revision --autogenerate"
db-downgrade = "alembic downgrade -1"
